[project]
name = "stringart"
version = "1.0.0"
description = "OpenCV-based computational string art: photo -> optimized pin sequence"
readme = "README.md"
authors = [
    { name = "Prem Dharshan", email = "whizzkid.dpd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numba>=0.68.0",
    "numpy>=2.5.3",
    "opencv-contrib-python>=5.0.0.93",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "tqdm>=4.70.1",
]

[project.scripts]
stringart = "stringart.cli:main"

[project.optional-dependencies]
demo = [
    "gradio>=6.29.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
